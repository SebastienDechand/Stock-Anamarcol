<div class="confirm-backdrop" (click)="cancelled.emit()">
  <div class="confirm-panel" (click)="$event.stopPropagation()">
    <div class="confirm-icon">
      <lucide-icon name="alert-triangle" [size]="28" />
    </div>
    <h3 class="confirm-title">{{ title || ('CONFIRM_DIALOG.TITLE' | translate) }}</h3>
    <p class="confirm-message">{{ message || ('CONFIRM_DIALOG.MESSAGE' | translate) }}</p>
    <div class="confirm-actions">
      <button
        class="confirm-btn confirm-btn--cancel"
        type="button"
        (click)="cancelled.emit()"
        [title]="'CONFIRM_DIALOG.CANCEL' | translate"
      >
        {{ cancelLabel || ('CONFIRM_DIALOG.CANCEL' | translate) }}
      </button>
      <button
        class="confirm-btn confirm-btn--danger"
        type="button"
        [disabled]="isLoading"
        (click)="confirmed.emit()"
        [title]="'CONFIRM_DIALOG.CONFIRM' | translate"
      >
        {{
          isLoading
            ? ('CONFIRM_DIALOG.DELETING' | translate)
            : confirmLabel || ('CONFIRM_DIALOG.CONFIRM_LABEL' | translate)
        }}
      </button>
    </div>
  </div>
</div>
