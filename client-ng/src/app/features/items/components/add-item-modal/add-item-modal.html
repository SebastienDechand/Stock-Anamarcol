<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'ITEMS.ADD_TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <form class="modal-panel__body" (ngSubmit)="submit()">
      <div class="form-row">
        <label class="form-label" for="name">{{ 'ITEMS.DENOMINATION' | translate }} *</label>
        <input
          id="name"
          class="form-input"
          [(ngModel)]="form.name"
          name="name"
          required
          [placeholder]="'ITEMS.DENOMINATION' | translate"
        />
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label class="form-label" for="supplier">{{ 'ITEMS.SUPPLIER' | translate }}</label>
          <select id="supplier" class="form-input" [(ngModel)]="form.supplier" name="supplier">
            <option value="">{{ 'COMMON.SELECT' | translate }}</option>
            @for (f of suppliers; track f) {
              <option [value]="f">{{ f }}</option>
            }
          </select>
        </div>

        <div class="form-row">
          <label class="form-label" for="status">{{ 'ITEMS.STATE' | translate }}</label>
          <select id="status" class="form-input" [(ngModel)]="form.status" name="status">
            <option value="">{{ 'COMMON.SELECT' | translate }}</option>
            @for (e of statuses; track e) {
              <option [value]="e">{{ e }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="qty">{{ 'ITEMS.QUANTITY' | translate }}</label>
        <input
          id="qty"
          class="form-input"
          type="number"
          min="0"
          [(ngModel)]="form.quantity"
          name="quantity"
        />
      </div>

      <div class="form-row form-row--inline">
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="form.cgKit" name="cgKit" />
          <span>{{ 'ITEMS.PREPARATION_CG' | translate }}</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="form.tpvKit" name="tpvKit" />
          <span>{{ 'ITEMS.PREPARATION_TPV' | translate }}</span>
        </label>
      </div>

      <div class="modal-panel__footer">
        <button
          type="button"
          class="btn-ghost"
          (click)="cancelled.emit()"
          [title]="'COMMON.CANCEL' | translate"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="!isFormValid"
          [title]="'ITEMS.ADD' | translate"
        >
          {{ 'ITEMS.ADD' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
