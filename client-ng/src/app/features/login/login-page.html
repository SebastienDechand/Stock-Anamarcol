@let lang = languageService.lang$ | async;

<div class="login">
  <div class="login__wrapper">
    <div class="login__card">
      <div class="login__header">
        <button
          class="login__lang-toggle"
          type="button"
          (click)="toggleLanguage()"
          [title]="
            lang === 'fr'
              ? ('TOPBAR.MENU.SWITCH_TO_EN' | translate)
              : ('TOPBAR.MENU.SWITCH_TO_FR' | translate)
          "
        >
          @if (lang === 'fr') {
            <svg viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg">
              <rect width="20" height="14" fill="#ED2939" />
              <rect width="13" height="14" fill="#fff" />
              <rect width="6.5" height="14" fill="#002395" />
            </svg>
          } @else {
            <svg viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg">
              <rect width="20" height="14" fill="#012169" />
              <path d="M0,0 L20,14 M0,14 L20,0" stroke="#fff" stroke-width="4" />
              <path d="M0,0 L20,14 M0,14 L20,0" stroke="#C8102E" stroke-width="2" />
              <rect x="8" y="0" width="4" height="14" fill="#fff" />
              <rect x="0" y="5" width="20" height="4" fill="#fff" />
              <rect x="9" y="0" width="2" height="14" fill="#C8102E" />
              <rect x="0" y="6" width="20" height="2" fill="#C8102E" />
            </svg>
          }
        </button>

        <div class="login__icon-wrap">
          <lucide-icon [img]="Package" [size]="28" class="login__icon" />
        </div>
        <h1 class="login__title">{{ 'LOGIN.TITLE' | translate }}</h1>
        <p class="login__subtitle">ANAMARCOL</p>
      </div>

      <div class="login__body">
        @if (authFacade.loginError$ | async; as error) {
          <div class="login__error">{{ error }}</div>
        }

        <form class="login__form" (ngSubmit)="onSubmit()">
          <div class="login__field">
            <label class="login__label" for="email">{{ 'LOGIN.EMAIL' | translate }}</label>
            <input
              id="email"
              name="email"
              class="login__input"
              type="email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate"
              autocomplete="email"
              required
            />
          </div>

          <div class="login__field">
            <label class="login__label" for="password">{{ 'LOGIN.PASSWORD' | translate }}</label>
            <div class="login__password-wrap">
              <input
                id="password"
                name="password"
                class="login__input"
                [type]="showPassword() ? 'text' : 'password'"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate"
                autocomplete="current-password"
                required
              />
              <button
                class="login__toggle-password"
                type="button"
                (click)="togglePassword()"
                [title]="
                  showPassword()
                    ? ('COMMON.HIDE_PASSWORD' | translate)
                    : ('COMMON.SHOW_PASSWORD' | translate)
                "
              >
                @if (showPassword()) {
                  <lucide-icon [img]="EyeOff" [size]="18" />
                } @else {
                  <lucide-icon [img]="Eye" [size]="18" />
                }
              </button>
            </div>
          </div>

          <button
            class="login__submit"
            type="submit"
            [disabled]="(authFacade.isLoading$ | async) || !email() || !password()"
          >
            @if (authFacade.isLoading$ | async) {
              <span class="login__spinner"></span>
              {{ 'LOGIN.LOADING' | translate }}
            } @else {
              {{ 'LOGIN.SUBMIT' | translate }}
            }
          </button>
        </form>
      </div>
    </div>

    <p class="login__footer">&copy; {{ year }} ANAMARCOL - Stock Manager</p>
  </div>
</div>
