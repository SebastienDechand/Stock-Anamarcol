<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'MEMBERS.EDIT_TITLE' | translate }}</h2>
      <button
        class="icon-btn"
        type="button"
        (click)="cancelled.emit()"
        [title]="'COMMON.CLOSE' | translate"
      >
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <form class="modal-panel__body" (ngSubmit)="submit()">
      @if (isSuperadmin()) {
        <div class="avatar-section">
          <div class="avatar-wrap">
            @if (avatarUrl) {
              <img [src]="avatarUrl" [alt]="user().username" class="avatar-img" />
            } @else {
              <span class="avatar-initials">{{ initials }}</span>
            }
            <label class="avatar-upload" [title]="'MEMBERS.CHANGE_PHOTO' | translate">
              <lucide-icon name="camera" [size]="14" />
              <input type="file" accept="image/*" class="sr-only" (change)="onFileChange($event)" />
            </label>
          </div>
        </div>
      }

      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.PSEUDO' | translate }} *</label>
          <input class="form-input" [(ngModel)]="form.username" name="username" required />
        </div>
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.EMAIL' | translate }} *</label>
          <input class="form-input" type="email" [(ngModel)]="form.email" name="email" required />
        </div>
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.POSITION' | translate }}</label>
          <input
            class="form-input"
            [(ngModel)]="form.position"
            name="position"
            [placeholder]="'MEMBERS.POSITION_PLACEHOLDER' | translate"
          />
        </div>
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.PHONE' | translate }}</label>
          <input
            class="form-input"
            [(ngModel)]="form.phone"
            name="phone"
            placeholder="06 XX XX XX XX"
          />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">{{ 'MEMBERS.DEPARTMENT' | translate }}</label>
        <select class="form-input" [(ngModel)]="form.department" name="department">
          <option value="">{{ 'MEMBERS.SELECT' | translate }}</option>
          @for (department of departments; track department) {
            <option [value]="department">{{ departmentLabelKeys[department] | translate }}</option>
          }
        </select>
      </div>

      <div class="modal-panel__footer">
        <button
          type="button"
          class="btn-ghost"
          (click)="cancelled.emit()"
          [title]="'COMMON.CANCEL' | translate"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="!form.username?.trim() || !form.email?.trim()"
          [title]="'COMMON.SAVE' | translate"
        >
          {{ 'COMMON.SAVE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
