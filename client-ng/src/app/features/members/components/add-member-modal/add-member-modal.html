<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'MEMBERS.ADD_TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <form class="modal-panel__body" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.PSEUDO' | translate }} *</label>
          <input
            class="form-input"
            [(ngModel)]="form.username"
            name="username"
            required
            [placeholder]="'MEMBERS.PSEUDO' | translate"
          />
        </div>
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.EMAIL' | translate }} *</label>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="form.email"
            name="email"
            required
            placeholder="prenom.nom@anamarcol.com"
          />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">{{ 'MEMBERS.PASSWORD' | translate }} *</label>
        <div class="input-wrap">
          <input
            class="form-input"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="form.password"
            name="password"
            required
            [placeholder]="'MEMBERS.PASSWORD' | translate"
          />
          <button
            type="button"
            class="input-wrap__toggle"
            (click)="showPassword = !showPassword"
            [title]="
              showPassword
                ? ('COMMON.HIDE_PASSWORD' | translate)
                : ('COMMON.SHOW_PASSWORD' | translate)
            "
          >
            <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="16" />
          </button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.POSITION' | translate }}</label>
          <input
            class="form-input"
            [(ngModel)]="form.position"
            name="position"
            [placeholder]="'MEMBERS.POSITION_PLACEHOLDER' | translate"
          />
        </div>
        <div class="form-row">
          <label class="form-label">{{ 'MEMBERS.PHONE' | translate }}</label>
          <input
            class="form-input"
            [(ngModel)]="form.phone"
            name="phone"
            placeholder="06 XX XX XX XX"
          />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">{{ 'MEMBERS.DEPARTMENT' | translate }}</label>
        <select class="form-input" [(ngModel)]="form.department" name="department">
          <option value="">{{ 'MEMBERS.SELECT' | translate }}</option>
          @for (department of departments; track department) {
            <option [value]="department">{{ departmentLabelKeys[department] | translate }}</option>
          }
        </select>
      </div>

      <div class="modal-panel__footer">
        <button
          type="button"
          class="btn-ghost"
          (click)="cancelled.emit()"
          [title]="'COMMON.CANCEL' | translate"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="!form.username.trim() || !form.email.trim() || !form.password.trim()"
          [title]="'COMMON.CREATE' | translate"
        >
          {{ 'COMMON.CREATE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
