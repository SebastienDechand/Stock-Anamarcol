<div
  class="contact-card"
  [class.contact-card--clickable]="clickable()"
  (click)="clickable() && selected.emit(contact())"
>
  <div class="contact-card__top">
    <div class="contact-card__avatar">
      @if (avatarUrl) {
        <img [src]="avatarUrl" [alt]="contact().name" class="contact-card__img" />
      } @else {
        <span class="contact-card__initials">{{ initials }}</span>
      }
    </div>
    <div class="contact-card__identity">
      @if (contact().position) {
        <p class="contact-card__poste">{{ contact().position }}</p>
      }
      @if (contact().name) {
        <h3 class="contact-card__name">{{ contact().name }}</h3>
      }
    </div>
  </div>

  <div class="contact-card__details">
    @if (contact().email) {
      <div class="detail-row">
        <lucide-icon name="mail" [size]="13" />
        <span>{{ contact().email }}</span>
      </div>
    }
    @if (contact().phone) {
      <div class="detail-row">
        <lucide-icon name="phone" [size]="13" />
        <span>{{ contact().phone }}</span>
      </div>
    }
    @if (contact().link) {
      <a
        [href]="contact().link"
        target="_blank"
        rel="noopener noreferrer"
        (click)="$event.stopPropagation()"
        class="detail-row detail-row--link"
      >
        <lucide-icon name="globe" [size]="13" />
        <span>Voir le site</span>
      </a>
    }
  </div>
</div>
