<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'CONTACTS.EDIT_TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="modal-panel__body">
      <!-- Avatar -->
      <div class="avatar-section">
        <div class="avatar-wrap">
          @if (avatarUrl) {
            <img [src]="avatarUrl" [alt]="contact().name" class="avatar-img" />
          } @else {
            <span class="avatar-initials">{{ initials }}</span>
          }
          <label class="avatar-upload" [title]="'CONTACTS.CHANGE_PHOTO' | translate">
            <lucide-icon name="camera" [size]="14" />
            <input type="file" accept="image/*" class="sr-only" (change)="onFileChange($event)" />
          </label>
        </div>
      </div>

      <form (ngSubmit)="submit()">
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">{{ 'CONTACTS.NAME' | translate }}</label>
            <input class="form-input" [(ngModel)]="form.name" name="name" />
          </div>
          <div class="form-row">
            <label class="form-label">{{ 'CONTACTS.COMPANY' | translate }}</label>
            <input class="form-input" [(ngModel)]="form.position" name="position" />
          </div>
          <div class="form-row">
            <label class="form-label">{{ 'CONTACTS.EMAIL' | translate }}</label>
            <input class="form-input" type="email" [(ngModel)]="form.email" name="email" />
          </div>
          <div class="form-row">
            <label class="form-label">{{ 'CONTACTS.PHONE' | translate }}</label>
            <input class="form-input" [(ngModel)]="form.phone" name="phone" />
          </div>
          <div class="form-row">
            <label class="form-label">{{ 'CONTACTS.CATEGORY' | translate }}</label>
            <select class="form-input" [(ngModel)]="form.category" name="category">
              <option value="external">{{ 'CONTACTS.CATEGORY_EXTERNAL' | translate }}</option>
              <option value="supplier">{{ 'CONTACTS.CATEGORY_SUPPLIER' | translate }}</option>
            </select>
          </div>
        </div>
        <div class="form-row website">
          <label class="form-label website">{{ 'CONTACTS.WEBSITE' | translate }}</label>
          <input class="form-input" [(ngModel)]="form.link" name="link" placeholder="https://..." />
        </div>

        <div class="modal-panel__footer">
          <button
            type="button"
            class="btn-ghost"
            (click)="cancelled.emit()"
            [title]="'COMMON.CANCEL' | translate"
          >
            {{ 'COMMON.CANCEL' | translate }}
          </button>
          <button type="submit" class="btn-primary" [title]="'COMMON.SAVE' | translate">
            {{ 'COMMON.SAVE' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
