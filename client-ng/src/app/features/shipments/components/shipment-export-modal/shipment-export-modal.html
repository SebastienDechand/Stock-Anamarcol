<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'SHIPMENTS_EXPORT.TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="modal-panel__body">
      <p class="export-count">
        {{ 'SHIPMENTS_EXPORT.COUNT' | translate: { count: shipments().length } }}
      </p>

      <div class="export-options">
        <button
          class="export-btn"
          (click)="exportCSV()"
          [title]="'SHIPMENTS_EXPORT.CSV' | translate"
        >
          <lucide-icon name="file-text" [size]="20" />
          <span class="export-btn__label">{{ 'SHIPMENTS_EXPORT.CSV' | translate }}</span>
          <span class="export-btn__desc">{{ 'SHIPMENTS_EXPORT.CSV_DESC' | translate }}</span>
        </button>

        <button
          class="export-btn"
          (click)="exportXLSX()"
          [title]="'SHIPMENTS_EXPORT.EXCEL' | translate"
        >
          <lucide-icon name="table" [size]="20" />
          <span class="export-btn__label">{{ 'SHIPMENTS_EXPORT.EXCEL' | translate }}</span>
          <span class="export-btn__desc">{{ 'SHIPMENTS_EXPORT.EXCEL_DESC' | translate }}</span>
        </button>

        <button
          class="export-btn"
          (click)="exportPDF()"
          [title]="'SHIPMENTS_EXPORT.PDF' | translate"
        >
          <lucide-icon name="file-down" [size]="20" />
          <span class="export-btn__label">{{ 'SHIPMENTS_EXPORT.PDF' | translate }}</span>
          <span class="export-btn__desc">{{ 'SHIPMENTS_EXPORT.PDF_DESC' | translate }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
