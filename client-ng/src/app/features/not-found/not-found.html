<div class="not-found">
  <div class="not-found__code">404</div>
  <h1 class="not-found__title">{{ 'NOT_FOUND.TITLE' | translate }}</h1>
  <p class="not-found__message">{{ 'NOT_FOUND.MESSAGE' | translate }}</p>
  <button class="not-found__button" (click)="goHome()" [title]="'NOT_FOUND.BACK' | translate">
    <lucide-icon [img]="home" [size]="16" /> {{ 'NOT_FOUND.BACK' | translate }}
  </button>
</div>
