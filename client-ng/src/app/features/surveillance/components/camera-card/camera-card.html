<div class="camera-card" [class.camera-card--full]="fullHeight()">
  @if (showHeader()) {
    <div class="camera-card__header">
      <div class="camera-card__header-left">
        <span class="camera-card__name">{{ camera().name | translate }}</span>
      </div>
      <div class="camera-card__controls">
        <button
          class="camera-card__ctrl-btn"
          (click)="zoomInStep()"
          [title]="'SURVEILLANCE.ZOOM_IN' | translate"
        >
          <lucide-icon [img]="zoomInIcon" [size]="14" />
        </button>
        <button
          class="camera-card__ctrl-btn"
          (click)="zoomOutStep()"
          [title]="'SURVEILLANCE.ZOOM_OUT' | translate"
        >
          <lucide-icon [img]="zoomOutIcon" [size]="14" />
        </button>
        <button
          class="camera-card__ctrl-btn"
          (click)="resetZoom()"
          [title]="'SURVEILLANCE.RESET' | translate"
        >
          <lucide-icon [img]="rotateCcwIcon" [size]="14" />
        </button>
      </div>
    </div>
  }
  <div
    #wrapper
    class="camera-card__viewport"
    [class.camera-card__viewport--full]="fullHeight()"
    [class.camera-card__viewport--dragging]="isDragging()"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()"
  >
    @if (streamUrl()) {
      <img
        [src]="streamUrl()"
        [alt]="camera().name"
        class="camera-card__img"
        [style.transform]="transformStyle()"
        draggable="false"
      />
      <div class="camera-card__live-badge">{{ 'SURVEILLANCE.LIVE' | translate }}</div>
    } @else {
      <div class="camera-card__placeholder">{{ 'SURVEILLANCE.LOADING' | translate }}</div>
    }
  </div>
  @if (showFooter()) {
    <div class="camera-card__footer">{{ 'SURVEILLANCE.PORT' | translate }} {{ camera().port }}</div>
  }
</div>
