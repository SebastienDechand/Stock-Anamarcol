<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'EXPORT.TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="modal-panel__body">
      <p class="export-count">{{ 'EXPORT.COUNT' | translate: { count: items.length } }}</p>

      <div class="export-options">
        <button class="export-btn" (click)="exportCSV()" [title]="'EXPORT.CSV' | translate">
          <lucide-icon name="file-text" [size]="20" />
          <span class="export-btn__label">{{ 'EXPORT.CSV' | translate }}</span>
          <span class="export-btn__desc">{{ 'EXPORT.CSV_DESC' | translate }}</span>
        </button>

        <button class="export-btn" (click)="exportXLSX()" [title]="'EXPORT.EXCEL' | translate">
          <lucide-icon name="table" [size]="20" />
          <span class="export-btn__label">{{ 'EXPORT.EXCEL' | translate }}</span>
          <span class="export-btn__desc">{{ 'EXPORT.EXCEL_DESC' | translate }}</span>
        </button>

        <button class="export-btn" (click)="exportPDF()" [title]="'EXPORT.PDF' | translate">
          <lucide-icon name="file-down" [size]="20" />
          <span class="export-btn__label">{{ 'EXPORT.PDF' | translate }}</span>
          <span class="export-btn__desc">{{ 'EXPORT.PDF_DESC' | translate }}</span>
        </button>

        <button class="export-btn" (click)="exportJSON()" [title]="'EXPORT.JSON' | translate">
          <lucide-icon name="braces" [size]="20" />
          <span class="export-btn__label">{{ 'EXPORT.JSON' | translate }}</span>
          <span class="export-btn__desc">{{ 'EXPORT.JSON_DESC' | translate }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
