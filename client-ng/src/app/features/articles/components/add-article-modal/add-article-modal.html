<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-panel__header">
      <h2 class="modal-panel__title">{{ 'ARTICLES.ADD_TITLE' | translate }}</h2>
      <button class="icon-btn" (click)="cancelled.emit()" [title]="'COMMON.CLOSE' | translate">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <form class="modal-panel__body" (ngSubmit)="submit()">
      <div class="form-row">
        <label class="form-label" for="denomination"
          >{{ 'ARTICLES.DENOMINATION' | translate }} *</label
        >
        <input
          id="denomination"
          class="form-input"
          [(ngModel)]="form.denomination"
          name="denomination"
          required
          [placeholder]="'ARTICLES.DENOMINATION' | translate"
        />
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label class="form-label" for="fournisseur">{{ 'ARTICLES.SUPPLIER' | translate }}</label>
          <select
            id="fournisseur"
            class="form-input"
            [(ngModel)]="form.fournisseur"
            name="fournisseur"
          >
            <option value="">{{ 'COMMON.SELECT' | translate }}</option>
            @for (f of fournisseurs; track f) {
              <option [value]="f">{{ f }}</option>
            }
          </select>
        </div>

        <div class="form-row">
          <label class="form-label" for="etat">{{ 'ARTICLES.STATE' | translate }}</label>
          <select id="etat" class="form-input" [(ngModel)]="form.etat" name="etat">
            <option value="">{{ 'COMMON.SELECT' | translate }}</option>
            @for (e of etats; track e) {
              <option [value]="e">{{ e }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="qty">{{ 'ARTICLES.QUANTITY' | translate }}</label>
        <input
          id="qty"
          class="form-input"
          type="number"
          min="0"
          [(ngModel)]="form.quantite"
          name="quantite"
        />
      </div>

      <div class="form-row form-row--inline">
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="form.prepaCG" name="prepaCG" />
          <span>{{ 'ARTICLES.PREPA_CG' | translate }}</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="form.prepaTPV" name="prepaTPV" />
          <span>{{ 'ARTICLES.PREPA_TPV' | translate }}</span>
        </label>
      </div>

      <div class="modal-panel__footer">
        <button
          type="button"
          class="btn-ghost"
          (click)="cancelled.emit()"
          [title]="'COMMON.CANCEL' | translate"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="!isFormValid"
          [title]="'ARTICLES.ADD' | translate"
        >
          {{ 'ARTICLES.ADD' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
