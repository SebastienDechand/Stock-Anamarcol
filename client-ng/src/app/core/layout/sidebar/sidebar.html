@let isOpen = uiFacade.sidebarOpen$ | async;

@if (isOpen) {
  <div class="sidebar__backdrop" (click)="toggle()"></div>
}

<aside class="sidebar" [class.sidebar--open]="isOpen">
  <div class="sidebar__header">
    @if (isOpen) {
      <a class="sidebar__logo" routerLink="/home">
        <div class="sidebar__logo-icon">
          <lucide-icon [img]="Package" [size]="18" />
        </div>
        <span class="sidebar__brand">ANAMARCOL</span>
      </a>
    }
    <button
      class="sidebar__toggle"
      [class.sidebar__toggle--solo]="!isOpen"
      (click)="toggle()"
      type="button"
      [title]="isOpen ? ('COMMON.CLOSE_MENU' | translate) : ('COMMON.OPEN_MENU' | translate)"
    >
      @if (isOpen) {
        <lucide-icon [img]="ChevronLeft" [size]="18" />
      } @else {
        <lucide-icon [img]="ChevronRight" [size]="18" />
      }
    </button>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems$ | async; track item.path) {
      <a
        class="sidebar__link"
        [class.sidebar__link--collapsed]="!isOpen"
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        [title]="!isOpen ? (item.label | translate) : ''"
        (click)="closeOnMobile()"
      >
        <lucide-icon [name]="item.icon" [size]="20" class="sidebar__icon" />
        @if (isOpen) {
          <span class="sidebar__label">{{ item.label | translate }}</span>
        }
      </a>
    }
  </nav>

  @if (isOpen) {
    <div class="sidebar__footer">
      <p class="sidebar__footer-text">Stock Manager v2.1</p>
      <a class="sidebar__footer-link" routerLink="/legal" (click)="closeOnMobile()">
        {{ 'NAV.LEGAL' | translate }}
      </a>
    </div>
  }
</aside>
