name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call: # Permet d'être appelé par deploy.yml

jobs:
  # ─── Tests Backend ────────────────────────────────────
  test-server:
    name: Tests Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-7.0.14

      - name: Run tests
        working-directory: ./server
        env:
          MONGOMS_PREFER_GLOBAL_PATH: "1"
        run: npm run test:ci

  # ─── Tests Frontend Angular ──────────────────────────
  test-client-ng:
    name: Tests Frontend Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ng/package-lock.json

      - name: Install dependencies
        working-directory: ./client-ng
        run: npm ci

      - name: Run tests
        working-directory: ./client-ng
        run: npm test

  # ─── Tests E2E (Playwright) ───────────────────────────
  test-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client-ng/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./client-ng
        run: npm ci

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-7.0.14

      - name: Install Playwright browsers
        working-directory: ./client-ng
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./client-ng
        env:
          MONGOMS_PREFER_GLOBAL_PATH: "1"
        run: npm run e2e
