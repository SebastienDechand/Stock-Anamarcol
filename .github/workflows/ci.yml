name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call: # Permet d'être appelé par deploy.yml

jobs:
  # ─── Tests Backend ────────────────────────────────────
  test-server:
    name: Tests Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run tests
        working-directory: ./server
        run: npm run test:ci

  # ─── Tests Frontend Angular ──────────────────────────
  test-client-ng:
    name: Tests Frontend Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client-ng/package-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        working-directory: ./client-ng
        run: npm ci

      - name: Run tests
        working-directory: ./client-ng
        run: npm test
