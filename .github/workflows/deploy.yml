name: Deploy to o2switch

on:
  push:
    branches: [main]
  workflow_dispatch: # Permet le déclenchement manuel

# Empêche les déploiements simultanés
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  # ─── Tests (gate) ────────────────────────────────────
  tests:
    name: Run Tests
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ─── Deploy Frontend ─────────────────────────────────
  deploy-client:
    name: Deploy Frontend (o2switch)
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build

      - name: Deploy to o2switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_FTP_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          local-dir: ./client/build/
          server-dir: ${{ secrets.O2SWITCH_CLIENT_PATH }}
          dangerous-clean-slate: false

  # ─── Deploy Backend ──────────────────────────────────
  deploy-server:
    name: Deploy Backend (o2switch)
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare server files for deployment
        run: |
          mkdir -p deploy-server
          rsync -av --exclude='__tests__' \
            --exclude='jest.config.js' \
            --exclude='jest.setup.js' \
            --exclude='coverage' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            --exclude='vercel.json' \
            ./server/ deploy-server/

      - name: Deploy server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_FTP_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          local-dir: ./deploy-server/
          server-dir: ${{ secrets.O2SWITCH_SERVER_PATH }}
