name: Deploy to o2switch

on:
  push:
    branches: [main]
  workflow_dispatch: # Permet le déclenchement manuel

# Empêche les déploiements simultanés
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  # ─── Tests (gate) ────────────────────────────────────
  tests:
    name: Run Tests
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ─── Deploy Frontend Angular (prod) ──────────────────
  deploy-client-ng:
    name: Deploy Frontend Angular (o2switch)
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ng/package-lock.json

      - name: Install dependencies
        working-directory: ./client-ng
        run: npm ci

      - name: Build frontend
        working-directory: ./client-ng
        run: npm run build

      - name: Deploy to o2switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.O2SWITCH_FTP_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          local-dir: ./client-ng/dist/client-ng/browser/
          server-dir: ${{ secrets.O2SWITCH_CLIENT_PATH }}
          dangerous-clean-slate: false

  # ─── Deploy Backend ──────────────────────────────────
  deploy-server:
    name: Deploy Backend (o2switch)
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Build TypeScript
        working-directory: ./server
        run: npm run build

      - name: Prepare server files for deployment
        run: |
          mkdir -p deploy-server
          rsync -av --exclude='*.test.ts' \
            --exclude='coverage' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            --exclude='vercel.json' \
            ./server/ deploy-server/
          mkdir -p deploy-server/tmp
          date > deploy-server/tmp/restart.txt

      - name: Deploy server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.O2SWITCH_FTP_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          local-dir: ./deploy-server/
          server-dir: ${{ secrets.O2SWITCH_SERVER_PATH }}

      - name: Warm up the server
        # Touching tmp/restart.txt above forces Passenger to respawn the Node
        # process on its next request, which only starts accepting connections
        # once it has connected to MongoDB Atlas. Hitting it here absorbs that
        # cold-start delay in CI instead of on the first real visitor.
        run: curl -sS --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 https://stock-api.anamarcol.com/jwtid
